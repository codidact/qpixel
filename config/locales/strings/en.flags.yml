en:
  flags:
    descriptions:
      history_other: >
        Below is a list of all the flags that the user have cast,
        the outcome of each them, and handling moderators' feedback, if any.
      history_self: >
        Below is a list of all the flags you have cast and the outcome of each of them.
        Moderators handling your flags may also have left you feedback.
    errors:
      create_generic: >
        Failed to raise the flag.
      rate_limited: >
        Thank you. Flags from people like you help us keep this site clean.
        However, you have reached your daily flag limit of %{count} flags.
        Please come back tomorrow to continue flagging.
    success:
      create_generic: >
        <strong>Thanks!</strong> We will review your flag.
      create_author_attention: >
        <strong>Thanks!</strong> Your flag was added as a comment for the author to review.
