en:
  flags:
    headers:
      history_other_prefix: >
        Flag History for
      history_self_prefix: >
        My Flag History
    descriptions:
      history_other: >
        Below is a list of all the flags this user has cast with their outcomes and any moderator feedback.
      history_self: >
        Below is a list of all the flags you have cast with their outcomes and any moderator feedback.
    errors:
      create_generic: >
        Failed to raise the flag.
      rate_limited: >
        Thank you. Flags from people like you help us keep this site clean.
        However, you have reached your daily flag limit of %{count} flags.
        Please come back tomorrow to continue flagging.
    success:
      create_generic: >
        <strong>Thanks!</strong> We will review your flag.
      create_author_attention: >
        <strong>Thanks!</strong> Your flag was added as a comment for the author to review.
