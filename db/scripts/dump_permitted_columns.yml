posts:
  columns:
    - id
    - title
    - body
    - tags_cache
    - score
    - parent_id
    - user_id
    - closed
    - closed_by_id
    - closed_at
    - deleted
    - deleted_by_id
    - deleted_at
    - created_at
    - updated_at
    - post_type_id
    - body_markdown
    - answer_count
    - last_activity
    - att_source
    - att_license_name
    - att_license_link
    - doc_slug
    - last_activity_by_id
    - community_id
    - close_reason_id
    - duplicate_post_id
    - category_id
    - license_id
    - help_category
    - help_ordering
    - upvote_count
    - downvote_count
    - comments_disabled
    - last_edited_at
    - last_edited_by_id
    - locked
    - locked_by_id
    - locked_at
    - locked_until
  query: >
    INNER JOIN categories c ON c.id = posts.category_id
    WHERE posts.deleted = FALSE AND posts.doc_slug IS NULL
    AND (c.min_view_trust_level IS NULL OR c.min_view_trust_level = 0)

posts_tags:
  columns:
    - tag_id
    - post_id

reaction_types:
