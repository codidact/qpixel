abilities:
  columns:
    - id
    - community_id
    - name
    - description
    - internal_id
    - icon
    - post_score_threshold
    - edit_score_threshold
    - flag_score_threshold
    - created_at
    - updated_at
    - summary

categories:
  columns:
    - id
    - name
    - short_wiki
    - community_id
    - created_at
    - updated_at
    - display_post_types
    - is_homepage
    - tag_set_id
    - min_trust_level
    - button_text
    - color_code
    - asking_guidance_override
    - answering_guidance_override
    - min_view_trust_level
    - license_id
    - sequence
    - use_for_hot_posts
    - use_for_advertisement
    - min_title_length
    - min_body_length
    - default_filter_id
  query: >
    WHERE min_view_trust_level IS NULL OR min_view_trust_level = 0

categories_moderator_tags:
  columns:
    - category_id
    - tag_id
  query: >
    INNER JOIN categories c ON c.id = categories_moderator_tags.category_id
    WHERE c.min_view_trust_level IS NULL OR c.min_view_trust_level = 0

categories_post_types:
  columns:
    - id
    - category_id
    - post_type_id
    - upvote_rep
    - downvote_rep
  query: >
    INNER JOIN categories c ON c.id = categories_post_types.category_id
    WHERE c.min_view_trust_level IS NULL OR c.min_view_trust_level = 0

categories_required_tags:
  columns:
    - category_id
    - tag_id
  query: >
    INNER JOIN categories c ON c.id = categories_required_tags.category_id
    WHERE c.min_view_trust_level IS NULL OR c.min_view_trust_level = 0

categories_topic_tags:
  columns:
    - category_id
    - tag_id
  query: >
    INNER JOIN categories c ON c.id = categories_topic_tags.category_id
    WHERE c.min_view_trust_level IS NULL OR c.min_view_trust_level = 0

close_reasons:
  columns:
    - id
    - name
    - description
    - active
    - requires_other_post
    - community_id

comment_threads:
  columns:
    - id
    - title
    - reply_count
    - post_id
    - locked
    - locked_by_id
    - locked_until
    - archived
    - archived_by_id
    - ever_archived_before
    - deleted
    - deleted_by_id
    - created_at
    - updated_at
    - community_id
    - locked_at
    - last_activity_at
  query: >
    INNER JOIN posts p on p.id = comment_threads.post_id
    WHERE comment_threads.deleted = FALSE AND p.deleted = FALSE

comments:
  columns:
    - id
    - created_at
    - updated_at
    - post_id
    - content
    - deleted
    - user_id
    - community_id
    - comment_thread_id
    - has_reference
    - reference_text
    - references_comment_id
    - last_activity_at
  query: >
    INNER JOIN comment_threads ct on ct.id = comments.comment_thread_id
    INNER JOIN posts p ON p.id = ct.post_id
    WHERE comments.deleted = FALSE AND ct.deleted = FALSE AND p.deleted = FALSE

communities:
  columns:
    - id
    - name
    - host
    - created_at
    - updated_at
    - is_fake
    - hidden
  query: >
    WHERE is_fake = FALSE AND hidden = FALSE

community_users:
  columns:
    - id
    - community_id
    - user_id
    - is_moderator
    - is_admin
    - reputation
    - trust_level
    - deleted
    - post_count
  query: >
    WHERE deleted = FALSE

filters:
  columns:
    - id
    - min_score
    - max_score
    - min_answers
    - max_answers
    - status
    - include_tags
    - exclude_tags
    - created_at
    - updated_at
    - source

flags:
  columns:
    - id
    - created_at
    - updated_at
    - status
    - community_id
    - post_flag_type_id
    - post_type
  query: >
    INNER JOIN post_flag_types pft ON pft.id = flags.post_flag_type_id
    WHERE pft.confidential = FALSE

licenses:
